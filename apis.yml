name: Rainmarket
description: >-
  Rainmarket is the flagship intelligence platform of Digital Media Nusantara
  (DMN), built to map and illuminate cross-border trade flows between ASEAN and
  Hong Kong's Greater Bay Area. It combines three integrated engines — Supply
  Chain Intelligence, a Tariff Tracker, and a Trade Flows Mapping engine — to
  turn roughly USD100 billion in previously unmapped or mispriced regional trade
  activity into investible, financeable, and transparently governed flows. The
  platform is architected for sovereign-grade deployment, targeting the
  security, compliance, and resiliency thresholds required by central banks,
  financial regulators, and national-level intelligence environments, and serves
  institutional investors, financial institutions, market regulators, and
  enterprise treasury and supply-chain teams. Rainmarket was surfaced as a
  portfolio company of 500 Global and profiled in the API Evangelist network. As
  of this pass the company publishes no public API, developer portal, or
  machine-readable service surface.
